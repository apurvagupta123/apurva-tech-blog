<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative elements - molecular structure -->
  <g opacity="0.1" stroke="#06b6d4" stroke-width="2" fill="none">
    <!-- Left side circles -->
    <circle cx="150" cy="150" r="40"/>
    <circle cx="100" cy="250" r="30"/>
    <circle cx="200" cy="300" r="35"/>
    <line x1="150" y1="150" x2="100" y2="250"/>
    <line x1="150" y1="150" x2="200" y2="300"/>
    <line x1="100" y1="250" x2="200" y2="300"/>

    <!-- Right side circles -->
    <circle cx="1050" cy="200" r="45"/>
    <circle cx="1100" cy="320" r="35"/>
    <circle cx="980" cy="380" r="40"/>
    <line x1="1050" y1="200" x2="1100" y2="320"/>
    <line x1="1050" y1="200" x2="980" y2="380"/>
    <line x1="1100" y1="320" x2="980" y2="380"/>
  </g>

  <!-- Accent bar on left -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accentGradient)"/>

  <!-- Main content area -->
  <g>
    <!-- Main heading -->
    <text x="600" y="140" font-family="Poppins, -apple-system, sans-serif" font-size="52" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="-1">
      AI Becomes Your Lab Partner
    </text>

    <!-- Subheading -->
    <text x="600" y="200" font-family="Segoe UI, -apple-system, sans-serif" font-size="28" font-weight="300" text-anchor="middle" fill="#06b6d4">
      Novo Nordisk + OpenAI Transform Drug Discovery
    </text>

    <!-- Accent line -->
    <rect x="350" y="220" width="500" height="3" fill="url(#accentGradient)" opacity="0.8"/>

    <!-- Supporting text -->
    <text x="600" y="280" font-family="Segoe UI, -apple-system, sans-serif" font-size="18" text-anchor="middle" fill="#cbd5e1" letter-spacing="0.5">
      How enterprise AI is revolutionizing pharmaceutical research
    </text>

    <!-- Bottom tags -->
    <g>
      <!-- Tag 1: AI -->
      <rect x="380" y="330" width="80" height="35" rx="18" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="2"/>
      <text x="420" y="353" font-family="Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#06b6d4">
        AI
      </text>

      <!-- Tag 2: Healthcare -->
      <rect x="490" y="330" width="140" height="35" rx="18" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="2"/>
      <text x="560" y="353" font-family="Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#06b6d4">
        Healthcare
      </text>

      <!-- Tag 3: Innovation -->
      <rect x="660" y="330" width="130" height="35" rx="18" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="2"/>
      <text x="725" y="353" font-family="Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#06b6d4">
        Innovation
      </text>
    </g>

    <!-- Featured on badge -->
    <g opacity="0.8">
      <text x="600" y="430" font-family="Segoe UI, -apple-system, sans-serif" font-size="13" text-anchor="middle" fill="#94a3b8" letter-spacing="1">
        Featured on theapurva.com
      </text>
    </g>
  </g>

  <!-- Accent dots for visual interest -->
  <circle cx="950" cy="500" r="4" fill="#06b6d4" opacity="0.6"/>
  <circle cx="280" cy="480" r="3" fill="#06b6d4" opacity="0.5"/>
  <circle cx="1050" cy="580" r="5" fill="#06b6d4" opacity="0.4"/>
</svg>