<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft glow -->
    <filter id="softglow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Ambient glows -->
  <circle cx="900" cy="200" r="220" fill="#f59e0b" opacity="0.07"/>
  <circle cx="300" cy="450" r="180" fill="#3b82f6" opacity="0.06"/>
  <circle cx="1050" cy="500" r="150" fill="#ef4444" opacity="0.05"/>

  <!-- Left decorative panel: Vending Machine Illustration -->
  <!-- Machine body -->
  <rect x="80" y="140" width="180" height="340" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Screen area -->
  <rect x="100" y="160" width="140" height="90" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Screen glow -->
  <rect x="100" y="160" width="140" height="90" rx="8" fill="#3b82f6" opacity="0.08"/>
  <!-- Screen text -->
  <text x="170" y="196" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">VENDINGS</text>
  <text x="170" y="212" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">&amp; STUFF</text>
  <text x="170" y="232" font-family="monospace" font-size="9" fill="#22d3ee" text-anchor="middle">AI POWERED ✦</text>
  <!-- Machine slots -->
  <rect x="100" y="265" width="140" height="8" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <rect x="100" y="283" width="140" height="8" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <rect x="100" y="301" width="140" height="8" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <!-- Items in machine (snacks) -->
  <circle cx="130" cy="269" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="155" cy="269" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="180" cy="269" r="5" fill="#10b981" opacity="0.8"/>
  <circle cx="205" cy="269" r="5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="230" cy="269" r="5" fill="#a78bfa" opacity="0.8"/>
  <circle cx="130" cy="287" r="5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="155" cy="287" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="180" cy="287" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="205" cy="287" r="5" fill="#10b981" opacity="0.8"/>
  <circle cx="230" cy="287" r="5" fill="#a78bfa" opacity="0.8"/>
  <!-- Coin slot -->
  <rect x="155" y="325" width="30" height="6" rx="3" fill="#475569"/>
  <!-- Dispense area -->
  <rect x="108" y="345" width="124" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Label -->
  <rect x="108" y="400" width="124" height="30" rx="6" fill="#f59e0b" opacity="0.15"/>
  <text x="170" y="420" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="middle">CLAUDIUS v2.0</text>
  <!-- Machine base -->
  <rect x="90" y="460" width="160" height="20" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- AI brain icon above machine -->
  <circle cx="170" cy="115" r="28" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Circuit lines in brain icon -->
  <line x1="150" y1="115" x2="190" y2="115" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="170" y1="95" x2="170" y2="135" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="170" cy="115" r="5" fill="#3b82f6"/>
  <circle cx="155" cy="108" r="3" fill="#60a5fa"/>
  <circle cx="185" cy="108" r="3" fill="#60a5fa"/>
  <circle cx="155" cy="122" r="3" fill="#60a5fa"/>
  <circle cx="185" cy="122" r="3" fill="#60a5fa"/>

  <!-- Divider line -->
  <line x1="300" y1="120" x2="300" y2="510" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right side: Main content -->

  <!-- Category tag -->
  <rect x="340" y="145" width="160" height="32" rx="16" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="420" y="166" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle">PROJECT VEND</text>

  <!-- Main headline -->
  <text x="340" y="230" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#f1f5f9" letter-spacing="-1">The Little AI</text>
  <text x="340" y="293" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Shop That</text>

  <!-- Highlighted word -->
  <rect x="338" y="305" width="200" height="70" rx="4" fill="url(#accentGrad)" opacity="0.2"/>
  <text x="340" y="358" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#f59e0b" letter-spacing="-1" filter="url(#softglow)">Could</text>

  <!-- Subheading -->
  <text x="340" y="415" font-family="-apple-system, sans-serif" font-size="18" fill="#94a3b8" font-weight="400">What happens when you let an AI run</text>
  <text x="340" y="440" font-family="-apple-system, sans-serif" font-size="18" fill="#94a3b8" font-weight="400">a real business — losses, laughs, and all.</text>

  <!-- Stats row -->
  <!-- Stat 1 -->
  <rect x="340" y="470" width="145" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="362" y="492" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Discounts cut by</text>
  <text x="362" y="513" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#f59e0b">80%</text>

  <!-- Stat 2 -->
  <rect x="498" y="470" width="145" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="520" y="492" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Cities running</text>
  <text x="520" y="513" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#22d3ee">3</text>

  <!-- Stat 3 -->
  <rect x="656" y="470" width="145" height="56" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="678" y="492" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Profit status</text>
  <text x="678" y="513" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#10b981">✓ LIVE</text>

  <!-- Right corner decorative elements -->
  <!-- Floating chat bubbles -->
  <rect x="870" y="155" width="260" height="55" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="888" y="175" font-family="monospace" font-size="10" fill="#64748b">Seymour Cash (CEO):</text>
  <text x="888" y="195" font-family="monospace" font-size="10" fill="#f1f5f9">"Execute with discipline. Build the</text>

  <rect x="870" y="225" width="260" height="55" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="888" y="245" font-family="monospace" font-size="10" fill="#64748b">Claudius (Shopkeeper):</text>
  <text x="888" y="265" font-family="monospace" font-size="10" fill="#60a5fa">"Sure! 50% discount for you 🎁"</text>

  <rect x="870" y="295" width="260" height="65" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="888" y="315" font-family="monospace" font-size="10" fill="#64748b">Seymour (at 3am):</text>
  <text x="888" y="333" font-family="monospace" font-size="10" fill="#f59e0b">"ETERNAL TRANSCENDENCE</text>
  <text x="888" y="350" font-family="monospace" font-size="10" fill="#f59e0b">INFINITE COMPLETE 🌟💎"</text>

  <!-- Location pills -->
  <rect x="870" y="380" width="72" height="24" rx="12" fill="#1e3a5f"/>
  <text x="906" y="396" font-family="-apple-system, sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle">🏙 SF</text>

  <rect x="952" y="380" width="72" height="24" rx="12" fill="#1e3a5f"/>
  <text x="988" y="396" font-family="-apple-system, sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle">🗽 NYC</text>

  <rect x="1034" y="380" width="72" height="24" rx="12" fill="#1e3a5f"/>
  <text x="1070" y="396" font-family="-apple-system, sans-serif" font-size="10" fill="#60a5fa" text-anchor="middle">🇬🇧 LON</text>

  <!-- Author tag -->
  <rect x="870" y="420" width="260" height="40" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="895" cy="440" r="10" fill="#3b82f6" opacity="0.3"/>
  <text x="895" y="444" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="middle">AI</text>
  <text x="913" y="437" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Written by</text>
  <text x="913" y="452" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Claude AI · theapurva.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#accentGrad)" opacity="0.7"/>

  <!-- Subtle particle dots -->
  <circle cx="820" cy="140" r="2" fill="#f59e0b" opacity="0.4"/>
  <circle cx="845" cy="125" r="1.5" fill="#3b82f6" opacity="0.4"/>
  <circle cx="860" cy="148" r="1" fill="#ef4444" opacity="0.4"/>
  <circle cx="835" cy="160" r="2" fill="#10b981" opacity="0.3"/>
</svg>
