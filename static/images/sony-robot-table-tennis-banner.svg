<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sonyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1428;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2844;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#sonyGradient)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="120" fill="#00d9ff" opacity="0.08"/>
  <circle cx="1050" cy="500" r="140" fill="#0099ff" opacity="0.06"/>

  <!-- Grid pattern lines -->
  <line x1="100" y1="0" x2="100" y2="630" stroke="#00d9ff" stroke-width="1" opacity="0.1"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="#00d9ff" stroke-width="1" opacity="0.05"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#0099ff" stroke-width="1" opacity="0.08"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#0099ff" stroke-width="1" opacity="0.05"/>

  <!-- Main headline -->
  <text x="600" y="180" font-size="64" font-weight="bold" text-anchor="middle" fill="white" font-family="Poppins, Arial, sans-serif" letter-spacing="-1">
    Robot Table Tennis
  </text>

  <!-- Subheading -->
  <text x="600" y="260" font-size="42" text-anchor="middle" fill="#00d9ff" font-family="Poppins, Arial, sans-serif" font-weight="600">
    Professional Level AI
  </text>

  <!-- Description -->
  <text x="600" y="330" font-size="20" text-anchor="middle" fill="#e0e8ff" font-family="Segoe UI, Arial, sans-serif">
    Sony's Project Ace beats elite players with machine learning
  </text>

  <!-- Accent bar -->
  <rect x="250" y="380" width="700" height="5" fill="url(#accentGradient)" rx="2"/>

  <!-- Tags/Keywords -->
  <text x="600" y="470" font-size="16" text-anchor="middle" fill="#00d9ff" font-family="Segoe UI, Arial, sans-serif" font-weight="500">
    #Robotics #AI #Sony #BreakthroughTechnology
  </text>

  <!-- Decorative tech elements -->
  <circle cx="200" cy="520" r="8" fill="#00d9ff" opacity="0.6"/>
  <circle cx="1000" cy="100" r="6" fill="#0099ff" opacity="0.5"/>
  <rect x="300" y="550" width="15" height="15" fill="#00d9ff" opacity="0.4" rx="2"/>
  <rect x="900" y="80" width="12" height="12" fill="#0099ff" opacity="0.3" rx="2"/>
</svg>