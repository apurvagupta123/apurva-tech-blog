<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative Elements -->
  <circle cx="150" cy="100" r="80" fill="#0ea5e9" opacity="0.15"/>
  <circle cx="1050" cy="550" r="120" fill="#ffffff" opacity="0.1"/>
  <rect x="900" y="50" width="200" height="200" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1" rx="20"/>

  <!-- Search Icon (Magnifying Glass) -->
  <g transform="translate(100, 450)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <line x1="25" y1="25" x2="45" y2="45" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- AI Nodes/Connections -->
  <g opacity="0.2" stroke="#ffffff" stroke-width="1">
    <circle cx="900" cy="150" r="8" fill="#ffffff"/>
    <circle cx="950" cy="200" r="8" fill="#ffffff"/>
    <circle cx="880" cy="250" r="8" fill="#ffffff"/>
    <line x1="900" y1="150" x2="950" y2="200"/>
    <line x1="950" y1="200" x2="880" y2="250"/>
    <line x1="900" y1="150" x2="880" y2="250"/>
  </g>

  <!-- Main Headline -->
  <text x="600" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="68" font-weight="bold" fill="url(#textGradient)" letter-spacing="-2">
    Google Just Changed
  </text>

  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="68" font-weight="bold" fill="url(#textGradient)" letter-spacing="-2">
    How We Search
  </text>

  <!-- Subheading -->
  <text x="600" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#ffffff" opacity="0.95" font-style="italic">
    AI agents are transforming search into task completion
  </text>

  <!-- Tag/Category -->
  <rect x="450" y="430" width="300" height="50" fill="#ffffff" opacity="0.15" rx="25"/>
  <text x="600" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="600" letter-spacing="1">
    AI • Google • Search • Gemini
  </text>

  <!-- Accent Line -->
  <line x1="200" y1="550" x2="1000" y2="550" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
</svg>
