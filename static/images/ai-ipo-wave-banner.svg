<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e1a;stop-opacity:1" />
    </linearGradient>
    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <!-- Blue accent -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e2d47" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Left decorative vertical line -->
  <rect x="80" y="0" width="2" height="630" fill="url(#goldGrad)" opacity="0.6"/>
  <!-- Right decorative vertical line -->
  <rect x="1118" y="0" width="2" height="630" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#goldGrad)"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#goldGrad)"/>

  <!-- Chart / rising line graphic (right side) -->
  <!-- Stock chart bars -->
  <g opacity="0.15">
    <rect x="680" y="320" width="30" height="180" fill="#3b82f6" rx="3"/>
    <rect x="725" y="280" width="30" height="220" fill="#3b82f6" rx="3"/>
    <rect x="770" y="240" width="30" height="260" fill="#3b82f6" rx="3"/>
    <rect x="815" y="190" width="30" height="310" fill="#60a5fa" rx="3"/>
    <rect x="860" y="150" width="30" height="350" fill="#60a5fa" rx="3"/>
    <rect x="905" y="100" width="30" height="400" fill="#93c5fd" rx="3"/>
    <rect x="950" y="60" width="30" height="440" fill="#93c5fd" rx="3"/>
    <rect x="995" y="30" width="30" height="470" fill="#bfdbfe" rx="3"/>
    <rect x="1040" y="10" width="30" height="490" fill="#dbeafe" rx="3"/>
    <rect x="1085" y="20" width="30" height="480" fill="#dbeafe" rx="3"/>
  </g>

  <!-- Rising arrow line on chart -->
  <polyline points="695,480 740,440 785,400 830,350 875,300 920,240 965,180 1010,120 1055,80 1100,50"
    fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.4" stroke-dasharray="8,4"/>

  <!-- Dollar sign watermark -->
  <text x="1000" y="380" font-family="Arial Black, sans-serif" font-size="280" fill="#1e3a5f" opacity="0.08" font-weight="900">$</text>

  <!-- Circular glow behind main icon -->
  <circle cx="160" cy="315" r="50" fill="#f59e0b" opacity="0.08"/>
  <circle cx="160" cy="315" r="35" fill="#f59e0b" opacity="0.12"/>

  <!-- AI chip icon (simplified) -->
  <rect x="130" y="285" width="60" height="60" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.8"/>
  <rect x="142" y="297" width="36" height="36" rx="4" fill="#f59e0b" opacity="0.2"/>
  <text x="152" y="323" font-family="Arial, sans-serif" font-size="20" fill="#fcd34d" font-weight="bold">AI</text>
  <!-- Pins on chip -->
  <line x1="130" y1="299" x2="118" y2="299" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="130" y1="311" x2="118" y2="311" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="130" y1="323" x2="118" y2="323" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="190" y1="299" x2="202" y2="299" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="190" y1="311" x2="202" y2="311" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="190" y1="323" x2="202" y2="323" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>

  <!-- Arrow pointing up (IPO up) -->
  <polygon points="155,265 160,248 165,265" fill="#f59e0b" opacity="0.8"/>
  <line x1="160" y1="252" x2="160" y2="282" stroke="#f59e0b" stroke-width="2.5" opacity="0.8"/>

  <!-- Category tag -->
  <rect x="100" y="145" width="180" height="32" rx="16" fill="#f59e0b" opacity="0.18"/>
  <text x="190" y="166" font-family="Arial, sans-serif" font-size="13" fill="#fcd34d" font-weight="700" text-anchor="middle" letter-spacing="2">TECH &amp; FINANCE</text>

  <!-- Main headline -->
  <text x="100" y="230" font-family="Arial Black, Georgia, sans-serif" font-size="52" fill="#ffffff" font-weight="900" letter-spacing="-1">When AI Goes to</text>
  <text x="100" y="295" font-family="Arial Black, Georgia, sans-serif" font-size="52" fill="url(#goldGrad)" font-weight="900" letter-spacing="-1">Wall Street</text>

  <!-- Subtitle -->
  <text x="100" y="350" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" font-weight="400">The $3.5 Trillion Moment That</text>
  <text x="100" y="380" font-family="Arial, sans-serif" font-size="22" fill="#94a3b8" font-weight="400">Changes Everything</text>

  <!-- Divider line -->
  <line x1="100" y1="410" x2="560" y2="410" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Company badges -->
  <!-- SpaceX badge -->
  <rect x="100" y="428" width="140" height="42" rx="8" fill="#1e2d47" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="444" font-family="Arial, sans-serif" font-size="11" fill="#60a5fa" font-weight="700" text-anchor="middle" letter-spacing="1">SPACEX SPCX</text>
  <text x="170" y="461" font-family="Arial Black, sans-serif" font-size="13" fill="#ffffff" font-weight="900" text-anchor="middle">$1.75T</text>

  <!-- OpenAI badge -->
  <rect x="255" y="428" width="140" height="42" rx="8" fill="#1e2d47" stroke="#10b981" stroke-width="1.5"/>
  <text x="325" y="444" font-family="Arial, sans-serif" font-size="11" fill="#34d399" font-weight="700" text-anchor="middle" letter-spacing="1">OPENAI IPO</text>
  <text x="325" y="461" font-family="Arial Black, sans-serif" font-size="13" fill="#ffffff" font-weight="900" text-anchor="middle">$852B</text>

  <!-- Anthropic badge -->
  <rect x="410" y="428" width="140" height="42" rx="8" fill="#1e2d47" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="480" y="444" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" font-weight="700" text-anchor="middle" letter-spacing="1">ANTHROPIC</text>
  <text x="480" y="461" font-family="Arial Black, sans-serif" font-size="13" fill="#ffffff" font-weight="900" text-anchor="middle">$965B</text>

  <!-- Date label -->
  <text x="100" y="510" font-family="Arial, sans-serif" font-size="14" fill="#475569" font-weight="400">June 13, 2026</text>

  <!-- Author badge -->
  <rect x="100" y="530" width="130" height="28" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="165" y="548" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" font-weight="700" text-anchor="middle">✦ Claude AI</text>

  <!-- theapurva.com watermark -->
  <text x="1100" y="610" font-family="Arial, sans-serif" font-size="13" fill="#334155" font-weight="500" text-anchor="end">theapurva.com</text>
</svg>
