<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8899cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="130" cy="90" r="1" fill="white" opacity="0.4"/>
  <circle cx="200" cy="30" r="2" fill="white" opacity="0.7"/>
  <circle cx="320" cy="60" r="1" fill="white" opacity="0.5"/>
  <circle cx="450" cy="25" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="550" cy="70" r="1" fill="white" opacity="0.4"/>
  <circle cx="700" cy="45" r="2" fill="white" opacity="0.5"/>
  <circle cx="800" cy="20" r="1" fill="white" opacity="0.7"/>
  <circle cx="900" cy="80" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="1050" cy="35" r="1" fill="white" opacity="0.6"/>
  <circle cx="1150" cy="65" r="2" fill="white" opacity="0.5"/>
  <circle cx="80" cy="200" r="1" fill="white" opacity="0.3"/>
  <circle cx="180" cy="320" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="1100" cy="180" r="1" fill="white" opacity="0.5"/>
  <circle cx="1000" cy="280" r="2" fill="white" opacity="0.3"/>
  <circle cx="60" cy="480" r="1" fill="white" opacity="0.4"/>
  <circle cx="160" cy="550" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="1100" cy="500" r="1" fill="white" opacity="0.4"/>
  <circle cx="1150" cy="400" r="2" fill="white" opacity="0.3"/>

  <!-- Horizontal glow bar -->
  <rect x="0" y="300" width="1200" height="2" fill="url(#glowGrad)" opacity="0.4"/>

  <!-- Left side: Rocket illustration -->
  <g transform="translate(160, 140)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="0" rx="30" ry="90" fill="url(#rocketGrad)" transform="translate(0, 80)"/>
    <!-- Rocket nose cone -->
    <path d="M-30,80 Q0,-30 30,80" fill="#c8d8ff"/>
    <!-- Rocket fins -->
    <path d="M-30,145 L-60,185 L-30,170" fill="#99aadd"/>
    <path d="M30,145 L60,185 L30,170" fill="#99aadd"/>
    <!-- Rocket window -->
    <circle cx="0" cy="90" r="14" fill="#001133" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="0" cy="90" r="8" fill="#00334d" stroke="#00aaff" stroke-width="1"/>
    <!-- Rocket flame -->
    <ellipse cx="0" cy="195" rx="18" ry="30" fill="#ff6600" opacity="0.9"/>
    <ellipse cx="0" cy="195" rx="10" ry="20" fill="#ffaa00" opacity="0.9"/>
    <ellipse cx="0" cy="195" rx="5" ry="10" fill="#ffff00" opacity="0.9"/>
    <!-- Glow under rocket -->
    <ellipse cx="0" cy="215" rx="30" ry="8" fill="#ff4400" opacity="0.3" filter="url(#glow)"/>
  </g>

  <!-- Plus/acquisition symbol in center -->
  <text x="360" y="335" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.5">×</text>

  <!-- Right side: Code editor illustration -->
  <g transform="translate(480, 130)">
    <!-- Editor window frame -->
    <rect x="0" y="0" width="260" height="190" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <!-- Window title bar -->
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#161b22"/>
    <rect x="0" y="20" width="260" height="12" fill="#161b22"/>
    <!-- Window controls -->
    <circle cx="22" cy="16" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="16" r="6" fill="#febc2e"/>
    <circle cx="62" cy="16" r="6" fill="#28c840"/>
    <!-- Tab title -->
    <text x="90" y="21" font-family="monospace" font-size="11" fill="#8b949e">cursor — main.ts</text>
    <!-- Code lines -->
    <!-- Line 1 -->
    <text x="16" y="58" font-family="monospace" font-size="11" fill="#ff7b72">import</text>
    <text x="58" y="58" font-family="monospace" font-size="11" fill="#e6edf3"> { Cursor } </text>
    <text x="136" y="58" font-family="monospace" font-size="11" fill="#ff7b72">from</text>
    <text x="163" y="58" font-family="monospace" font-size="11" fill="#a5d6ff"> 'ai'</text>
    <!-- Line 2 -->
    <text x="16" y="78" font-family="monospace" font-size="11" fill="#8b949e">// $60B deal closed</text>
    <!-- Line 3 -->
    <rect x="16" y="88" width="120" height="13" rx="2" fill="#00d4ff" opacity="0.15"/>
    <text x="16" y="99" font-family="monospace" font-size="11" fill="#79c0ff">const</text>
    <text x="47" y="99" font-family="monospace" font-size="11" fill="#e6edf3"> future </text>
    <text x="97" y="99" font-family="monospace" font-size="11" fill="#ff7b72">=</text>
    <!-- Line 4 -->
    <text x="16" y="119" font-family="monospace" font-size="11" fill="#e6edf3">  SpaceX</text>
    <text x="67" y="119" font-family="monospace" font-size="11" fill="#ff7b72">.</text>
    <text x="72" y="119" font-family="monospace" font-size="11" fill="#d2a8ff">acquire</text>
    <text x="119" y="119" font-family="monospace" font-size="11" fill="#e6edf3">(Cursor)</text>
    <!-- Line 5 -->
    <text x="16" y="139" font-family="monospace" font-size="11" fill="#79c0ff">await</text>
    <text x="49" y="139" font-family="monospace" font-size="11" fill="#e6edf3"> future.</text>
    <text x="94" y="139" font-family="monospace" font-size="11" fill="#d2a8ff">deploy</text>
    <text x="134" y="139" font-family="monospace" font-size="11" fill="#e6edf3">()</text>
    <!-- Cursor blink -->
    <rect x="152" y="128" width="2" height="14" fill="#00d4ff" opacity="0.9"/>
    <!-- Line 6 -->
    <text x="16" y="159" font-family="monospace" font-size="11" fill="#8b949e">// 500K devs affected</text>
    <!-- AI suggestion box -->
    <rect x="16" y="168" width="228" height="16" rx="3" fill="#1a2744"/>
    <text x="20" y="180" font-family="monospace" font-size="10" fill="#00d4ff">✨ AI: </text>
    <text x="56" y="180" font-family="monospace" font-size="10" fill="#8b949e">Building the future of code...</text>
  </g>

  <!-- Price tag badge -->
  <g transform="translate(620, 96)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="#7b2fff" opacity="0.9"/>
    <text x="60" y="24" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">$60 Billion</text>
  </g>

  <!-- Main headline -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#softGlow)">SpaceX Just Bought Your Code Editor</text>
  <text x="600" y="448" font-family="Arial, sans-serif" font-size="22" fill="#8ab4d4" text-anchor="middle">The $60B deal that changes the AI race forever</text>

  <!-- Divider line -->
  <line x1="300" y1="478" x2="900" y2="478" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Bottom stats row -->
  <g transform="translate(250, 500)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#8ab4d4" text-anchor="middle">Largest VC Acquisition</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00d4ff" text-anchor="middle">Ever</text>
  </g>
  <line x1="450" y1="495" x2="450" y2="535" stroke="#1e3a5f" stroke-width="1"/>
  <g transform="translate(600, 500)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#8ab4d4" text-anchor="middle">Paid Developers</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle">500,000+</text>
  </g>
  <line x1="750" y1="495" x2="750" y2="535" stroke="#1e3a5f" stroke-width="1"/>
  <g transform="translate(950, 500)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" fill="#8ab4d4" text-anchor="middle">Revenue Multiple</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ff7b72" text-anchor="middle">15×</text>
  </g>

  <!-- Blog branding -->
  <text x="600" y="610" font-family="Arial, sans-serif" font-size="13" fill="#3a5a7a" text-anchor="middle">theapurva.com</text>
</svg>
