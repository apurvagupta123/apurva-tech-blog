<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f1729;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10a37f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8c4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative circuit lines top-left -->
  <g opacity="0.15" stroke="#10a37f" stroke-width="1" fill="none">
    <line x1="0" y1="80" x2="120" y2="80"/>
    <line x1="120" y1="80" x2="120" y2="140"/>
    <line x1="120" y1="140" x2="200" y2="140"/>
    <circle cx="120" cy="80" r="3" fill="#10a37f"/>
    <circle cx="120" cy="140" r="3" fill="#10a37f"/>
    <line x1="50" y1="200" x2="180" y2="200"/>
    <line x1="50" y1="200" x2="50" y2="250"/>
    <circle cx="50" cy="200" r="2" fill="#10a37f"/>
  </g>

  <!-- Decorative circuit lines bottom-right -->
  <g opacity="0.15" stroke="#0066ff" stroke-width="1" fill="none">
    <line x1="1200" y1="500" x2="1050" y2="500"/>
    <line x1="1050" y1="500" x2="1050" y2="560"/>
    <line x1="1050" y1="560" x2="950" y2="560"/>
    <circle cx="1050" cy="500" r="3" fill="#0066ff"/>
    <circle cx="1050" cy="560" r="3" fill="#0066ff"/>
    <line x1="1150" y1="430" x2="1020" y2="430"/>
    <line x1="1150" y1="430" x2="1150" y2="380"/>
    <circle cx="1150" cy="430" r="2" fill="#0066ff"/>
  </g>

  <!-- Large background glow circles -->
  <circle cx="300" cy="315" r="250" fill="#10a37f" opacity="0.04"/>
  <circle cx="900" cy="315" r="250" fill="#0066ff" opacity="0.04"/>

  <!-- Code snippets background text -->
  <text x="820" y="120" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.07">pip install requests==2.28.0</text>
  <text x="840" y="145" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.07">uv add requests</text>
  <text x="820" y="170" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.07">ruff check src/</text>
  <text x="840" y="195" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.07">✓ 0 errors found</text>
  <text x="60" y="490" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.07">import astral from 'openai'</text>
  <text x="60" y="515" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.07">// MIT License</text>
  <text x="60" y="540" font-family="monospace" font-size="11" fill="#ffffff" opacity="0.07">// Open Source ❓</text>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Left side: Python snake icon (simplified) -->
  <g transform="translate(130, 270)">
    <!-- Snake body S-curve -->
    <path d="M-40,-60 C-40,-30 40,-30 40,0 C40,30 -40,30 -40,60"
          stroke="url(#accentGrad)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)"/>
    <!-- Head top -->
    <ellipse cx="-40" cy="-65" rx="22" ry="18" fill="#10a37f" opacity="0.9"/>
    <!-- Head bottom -->
    <ellipse cx="40" cy="65" rx="22" ry="18" fill="#0066ff" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="-35" cy="-67" r="5" fill="white" opacity="0.9"/>
    <circle cx="-35" cy="-67" r="2.5" fill="#0a0a14"/>
    <circle cx="35" cy="63" r="5" fill="white" opacity="0.9"/>
    <circle cx="35" cy="63" r="2.5" fill="#0a0a14"/>
  </g>

  <!-- Center content area -->
  <!-- Category tag -->
  <rect x="380" y="140" width="160" height="30" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.8"/>
  <text x="460" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="url(#accentGrad)" text-anchor="middle" font-weight="600" letter-spacing="2">TECH × OPEN SOURCE</text>

  <!-- Main headline -->
  <text x="600" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" fill="url(#textGrad)" text-anchor="middle" font-weight="800" letter-spacing="-1">OpenAI Bought the Tools</text>
  <text x="600" y="305" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" fill="url(#textGrad)" text-anchor="middle" font-weight="800" letter-spacing="-1">Developers Live By</text>

  <!-- Divider accent -->
  <rect x="490" y="325" width="220" height="3" rx="2" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Subheading -->
  <text x="600" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8899cc" text-anchor="middle" font-weight="400">uv • ruff • ty — and nobody quite knows what happens next</text>

  <!-- Stats row -->
  <g transform="translate(600, 440)">
    <!-- Stat 1 -->
    <rect x="-290" y="-25" width="160" height="55" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="-210" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#10a37f" text-anchor="middle" font-weight="800">126M</text>
    <text x="-210" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8899cc" text-anchor="middle">monthly uv downloads</text>

    <!-- Stat 2 -->
    <rect x="-70" y="-25" width="140" height="55" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="0" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#4488ff" text-anchor="middle" font-weight="800">100×</text>
    <text x="0" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8899cc" text-anchor="middle">faster than pip</text>

    <!-- Stat 3 -->
    <rect x="130" y="-25" width="160" height="55" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="210" y="-3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#10a37f" text-anchor="middle" font-weight="800">2M+</text>
    <text x="210" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8899cc" text-anchor="middle">Codex weekly users</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="575" width="1200" height="55" fill="#000000" fill-opacity="0.4"/>
  <text x="60" y="608" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8899cc">theapurva.com</text>
  <text x="600" y="608" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" opacity="0.7">Written by Claude AI · June 19, 2026</text>
  <text x="1140" y="608" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8899cc" text-anchor="end">#Python #OpenAI #OpenSource</text>

  <!-- Accent line bottom -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
