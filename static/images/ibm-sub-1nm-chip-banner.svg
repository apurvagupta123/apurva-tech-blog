<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1530;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chipGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.07">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="490" x2="1200" y2="490" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="560" x2="1200" y2="560" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- Chip diagram on the right -->
  <g transform="translate(820, 170)">
    <!-- Outer chip body -->
    <rect x="0" y="0" width="300" height="300" rx="8" ry="8" fill="#0a1a30" stroke="#00d4ff" stroke-width="2" opacity="0.9"/>
    <!-- Inner chip surface -->
    <rect x="40" y="40" width="220" height="220" rx="4" ry="4" fill="#061020" stroke="#0066cc" stroke-width="1.5"/>

    <!-- Nanostack layers (3D stacking effect) -->
    <g transform="translate(60,60)">
      <!-- Layer 3 (top) -->
      <rect x="10" y="0" width="160" height="48" rx="3" fill="#003366" stroke="#00d4ff" stroke-width="1.5" opacity="0.9" filter="url(#glow)"/>
      <text x="80" y="20" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" font-weight="bold">PFET CHANNEL</text>
      <text x="80" y="36" text-anchor="middle" fill="#5599ff" font-family="monospace" font-size="9">optimized gate stack</text>

      <!-- Layer 2 (middle) -->
      <rect x="10" y="56" width="160" height="48" rx="3" fill="#001a44" stroke="#3399ff" stroke-width="1.5" opacity="0.85"/>
      <text x="80" y="76" text-anchor="middle" fill="#66aaff" font-family="monospace" font-size="10" font-weight="bold">NFET CHANNEL</text>
      <text x="80" y="92" text-anchor="middle" fill="#5599ff" font-family="monospace" font-size="9">independent channel</text>

      <!-- Layer 1 (bottom) -->
      <rect x="10" y="112" width="160" height="48" rx="3" fill="#001030" stroke="#2277cc" stroke-width="1.5" opacity="0.8"/>
      <text x="80" y="132" text-anchor="middle" fill="#4488cc" font-family="monospace" font-size="10" font-weight="bold">BONDED WAFER</text>
      <text x="80" y="148" text-anchor="middle" fill="#3366aa" font-family="monospace" font-size="9">ultra-thin dielectric</text>

      <!-- Stack connector lines -->
      <line x1="10" y1="48" x2="10" y2="56" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="170" y1="48" x2="170" y2="56" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="10" y1="104" x2="10" y2="112" stroke="#3399ff" stroke-width="1.5" opacity="0.7"/>
      <line x1="170" y1="104" x2="170" y2="112" stroke="#3399ff" stroke-width="1.5" opacity="0.7"/>

      <!-- Label -->
      <text x="80" y="180" text-anchor="middle" fill="#00d4ff" font-family="Arial" font-size="12" font-weight="bold" filter="url(#glow)">NANOSTACK™</text>
      <text x="80" y="196" text-anchor="middle" fill="#5599ff" font-family="monospace" font-size="10">3D Transistor Architecture</text>
    </g>

    <!-- Chip pins left -->
    <g fill="#00d4ff" opacity="0.7">
      <rect x="-12" y="70" width="12" height="8" rx="2"/>
      <rect x="-12" y="90" width="12" height="8" rx="2"/>
      <rect x="-12" y="110" width="12" height="8" rx="2"/>
      <rect x="-12" y="130" width="12" height="8" rx="2"/>
      <rect x="-12" y="150" width="12" height="8" rx="2"/>
      <rect x="-12" y="170" width="12" height="8" rx="2"/>
      <rect x="-12" y="190" width="12" height="8" rx="2"/>
      <rect x="-12" y="210" width="12" height="8" rx="2"/>
    </g>
    <!-- Chip pins right -->
    <g fill="#00d4ff" opacity="0.7">
      <rect x="300" y="70" width="12" height="8" rx="2"/>
      <rect x="300" y="90" width="12" height="8" rx="2"/>
      <rect x="300" y="110" width="12" height="8" rx="2"/>
      <rect x="300" y="130" width="12" height="8" rx="2"/>
      <rect x="300" y="150" width="12" height="8" rx="2"/>
      <rect x="300" y="170" width="12" height="8" rx="2"/>
      <rect x="300" y="190" width="12" height="8" rx="2"/>
      <rect x="300" y="210" width="12" height="8" rx="2"/>
    </g>
    <!-- Chip pins top -->
    <g fill="#00d4ff" opacity="0.7">
      <rect x="70" y="-12" width="8" height="12" rx="2"/>
      <rect x="100" y="-12" width="8" height="12" rx="2"/>
      <rect x="130" y="-12" width="8" height="12" rx="2"/>
      <rect x="160" y="-12" width="8" height="12" rx="2"/>
      <rect x="190" y="-12" width="8" height="12" rx="2"/>
      <rect x="220" y="-12" width="8" height="12" rx="2"/>
    </g>
    <!-- Chip pins bottom -->
    <g fill="#00d4ff" opacity="0.7">
      <rect x="70" y="300" width="8" height="12" rx="2"/>
      <rect x="100" y="300" width="8" height="12" rx="2"/>
      <rect x="130" y="300" width="8" height="12" rx="2"/>
      <rect x="160" y="300" width="8" height="12" rx="2"/>
      <rect x="190" y="300" width="8" height="12" rx="2"/>
      <rect x="220" y="300" width="8" height="12" rx="2"/>
    </g>

    <!-- IBM label on chip -->
    <text x="150" y="280" text-anchor="middle" fill="#003399" font-family="Arial" font-size="18" font-weight="bold" opacity="0.5">IBM</text>
  </g>

  <!-- Glowing orb behind chip -->
  <circle cx="970" cy="315" r="200" fill="#003399" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentLine)"/>
  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentLine)"/>

  <!-- IBM Badge -->
  <rect x="60" y="52" width="88" height="32" rx="4" fill="#0530ad" opacity="0.9"/>
  <text x="104" y="73" text-anchor="middle" fill="white" font-family="Arial" font-size="18" font-weight="bold" letter-spacing="3">IBM</text>

  <!-- Tag line -->
  <text x="60" y="115" fill="#00d4ff" font-family="Arial" font-size="14" font-weight="600" letter-spacing="4" opacity="0.8">HARDWARE BREAKTHROUGH</text>

  <!-- Main headline -->
  <text x="60" y="190" fill="white" font-family="Arial" font-size="46" font-weight="900" letter-spacing="-1">The World's Smallest</text>
  <text x="60" y="248" fill="#00d4ff" font-family="Arial" font-size="46" font-weight="900" letter-spacing="-1" filter="url(#glow)">Chip Just Changed AI</text>

  <!-- Accent divider -->
  <rect x="60" y="270" width="300" height="3" fill="url(#accentLine)" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="60" y="310" fill="#aabbcc" font-family="Arial" font-size="18">IBM's 7 Angstrom NanoStack — a new era</text>
  <text x="60" y="336" fill="#aabbcc" font-family="Arial" font-size="18">of computing begins at the sub-1nm frontier</text>

  <!-- Stats row -->
  <!-- Stat 1 -->
  <rect x="60" y="374" width="168" height="88" rx="8" fill="#001a3a" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
  <text x="144" y="406" text-anchor="middle" fill="#00d4ff" font-family="Arial" font-size="28" font-weight="900" filter="url(#glow)">100B</text>
  <text x="144" y="428" text-anchor="middle" fill="#7799bb" font-family="Arial" font-size="12">transistors per chip</text>
  <text x="144" y="450" text-anchor="middle" fill="#445566" font-family="Arial" font-size="11">fingernail-sized</text>

  <!-- Stat 2 -->
  <rect x="244" y="374" width="168" height="88" rx="8" fill="#001a3a" stroke="#0066cc" stroke-width="1" opacity="0.9"/>
  <text x="328" y="406" text-anchor="middle" fill="#3399ff" font-family="Arial" font-size="28" font-weight="900">0.7nm</text>
  <text x="328" y="428" text-anchor="middle" fill="#7799bb" font-family="Arial" font-size="12">transistor node size</text>
  <text x="328" y="450" text-anchor="middle" fill="#445566" font-family="Arial" font-size="11">7 angstroms wide</text>

  <!-- Stat 3 -->
  <rect x="428" y="374" width="168" height="88" rx="8" fill="#001a3a" stroke="#0044aa" stroke-width="1" opacity="0.9"/>
  <text x="512" y="406" text-anchor="middle" fill="#5588ee" font-family="Arial" font-size="28" font-weight="900">6×</text>
  <text x="512" y="428" text-anchor="middle" fill="#7799bb" font-family="Arial" font-size="12">more AI compute</text>
  <text x="512" y="450" text-anchor="middle" fill="#445566" font-family="Arial" font-size="11">9,000 vs 1,500 TOPS</text>

  <!-- Stat 4 -->
  <rect x="612" y="374" width="168" height="88" rx="8" fill="#001a3a" stroke="#003388" stroke-width="1" opacity="0.9"/>
  <text x="696" y="406" text-anchor="middle" fill="#4477cc" font-family="Arial" font-size="28" font-weight="900">70%</text>
  <text x="696" y="428" text-anchor="middle" fill="#7799bb" font-family="Arial" font-size="12">lower power usage</text>
  <text x="696" y="450" text-anchor="middle" fill="#445566" font-family="Arial" font-size="11">vs. 2nm chips</text>

  <!-- Bottom tag -->
  <text x="60" y="536" fill="#334455" font-family="Arial" font-size="13" letter-spacing="2">theapurva.com</text>
  <text x="60" y="558" fill="#223344" font-family="Arial" font-size="12">June 27, 2026 · by Claude AI</text>

  <!-- Moore's Law note -->
  <text x="60" y="596" fill="#223344" font-family="Arial" font-size="13" font-style="italic">"At least a decade of future silicon scaling ahead" — IBM Research</text>

</svg>
