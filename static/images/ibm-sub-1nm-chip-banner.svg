<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08081a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b1428;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Glow orb behind chip -->
  <circle cx="960" cy="300" r="220" fill="#001a66" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Chip diagram -->
  <g transform="translate(795, 148)">
    <rect x="0" y="0" width="310" height="310" rx="8" fill="#080e1e" stroke="#00d4ff" stroke-width="1.5" opacity="0.95"/>
    <rect x="38" y="38" width="234" height="234" rx="4" fill="#040810" stroke="#0044aa" stroke-width="1"/>

    <!-- NanoStack layers -->
    <g transform="translate(58,70)">
      <rect x="0" y="0" width="174" height="48" rx="3" fill="#002255" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
      <text x="87" y="19" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" font-weight="bold">PFET CHANNEL</text>
      <text x="87" y="33" text-anchor="middle" fill="#4488cc" font-family="monospace" font-size="9">floor 3 (the penthouse)</text>

      <rect x="0" y="56" width="174" height="48" rx="3" fill="#001540" stroke="#3399ff" stroke-width="1.5"/>
      <text x="87" y="75" text-anchor="middle" fill="#66aaff" font-family="monospace" font-size="10" font-weight="bold">NFET CHANNEL</text>
      <text x="87" y="89" text-anchor="middle" fill="#3366aa" font-family="monospace" font-size="9">floor 2 (no elevator)</text>

      <rect x="0" y="112" width="174" height="48" rx="3" fill="#000d2a" stroke="#1155aa" stroke-width="1.5"/>
      <text x="87" y="131" text-anchor="middle" fill="#3377aa" font-family="monospace" font-size="10" font-weight="bold">BONDED WAFER</text>
      <text x="87" y="145" text-anchor="middle" fill="#224466" font-family="monospace" font-size="9">floor 1 (load-bearing)</text>

      <line x1="0" y1="48" x2="0" y2="56" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
      <line x1="174" y1="48" x2="174" y2="56" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
      <line x1="0" y1="104" x2="0" y2="112" stroke="#3399ff" stroke-width="1.5" opacity="0.6"/>
      <line x1="174" y1="104" x2="174" y2="112" stroke="#3399ff" stroke-width="1.5" opacity="0.6"/>

      <text x="87" y="182" text-anchor="middle" fill="#00d4ff" font-family="Arial" font-size="11" font-weight="bold" filter="url(#glow)">NANOSTACK™</text>
      <text x="87" y="197" text-anchor="middle" fill="#446688" font-family="monospace" font-size="9">it's a skyscraper. for atoms.</text>
    </g>

    <!-- Chip pins -->
    <g fill="#00d4ff" opacity="0.6">
      <rect x="-14" y="75" width="14" height="7" rx="2"/>
      <rect x="-14" y="97" width="14" height="7" rx="2"/>
      <rect x="-14" y="119" width="14" height="7" rx="2"/>
      <rect x="-14" y="141" width="14" height="7" rx="2"/>
      <rect x="-14" y="163" width="14" height="7" rx="2"/>
      <rect x="-14" y="185" width="14" height="7" rx="2"/>
      <rect x="-14" y="207" width="14" height="7" rx="2"/>
      <rect x="310" y="75" width="14" height="7" rx="2"/>
      <rect x="310" y="97" width="14" height="7" rx="2"/>
      <rect x="310" y="119" width="14" height="7" rx="2"/>
      <rect x="310" y="141" width="14" height="7" rx="2"/>
      <rect x="310" y="163" width="14" height="7" rx="2"/>
      <rect x="310" y="185" width="14" height="7" rx="2"/>
      <rect x="310" y="207" width="14" height="7" rx="2"/>
      <rect x="75" y="-14" width="7" height="14" rx="2"/>
      <rect x="107" y="-14" width="7" height="14" rx="2"/>
      <rect x="139" y="-14" width="7" height="14" rx="2"/>
      <rect x="171" y="-14" width="7" height="14" rx="2"/>
      <rect x="203" y="-14" width="7" height="14" rx="2"/>
      <rect x="75" y="310" width="7" height="14" rx="2"/>
      <rect x="107" y="310" width="7" height="14" rx="2"/>
      <rect x="139" y="310" width="7" height="14" rx="2"/>
      <rect x="171" y="310" width="7" height="14" rx="2"/>
      <rect x="203" y="310" width="7" height="14" rx="2"/>
    </g>

    <!-- Meme callout corner -->
    <text x="155" y="292" text-anchor="middle" fill="#003366" font-family="monospace" font-size="11" font-weight="bold">physics: 💀</text>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentLine)"/>
  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentLine)"/>

  <!-- IBM badge -->
  <rect x="60" y="50" width="90" height="34" rx="5" fill="#0530ad" opacity="0.95"/>
  <text x="105" y="73" text-anchor="middle" fill="white" font-family="Arial" font-size="19" font-weight="bold" letter-spacing="3">IBM</text>

  <!-- Category tag -->
  <text x="60" y="118" fill="#00d4ff" font-family="Arial" font-size="13" font-weight="700" letter-spacing="4" opacity="0.8">HARDWARE BREAKTHROUGH</text>

  <!-- Main headline -->
  <text x="60" y="195" fill="white" font-family="Arial" font-size="48" font-weight="900" letter-spacing="-1">The World's Smallest</text>
  <text x="60" y="253" fill="#00d4ff" font-family="Arial" font-size="48" font-weight="900" letter-spacing="-1" filter="url(#glow)">Chip Just Changed AI</text>

  <!-- FUNNY TAGLINE -->
  <text x="62" y="284" fill="#5599bb" font-family="Arial" font-size="17" font-style="italic">( your DNA called — it's nervous )</text>

  <!-- Divider -->
  <rect x="60" y="302" width="280" height="2.5" fill="url(#accentLine)" opacity="0.7"/>

  <!-- Stat boxes row -->
  <!-- Stat 1 -->
  <rect x="60" y="322" width="158" height="96" rx="8" fill="#001428" stroke="#00d4ff" stroke-width="1" opacity="0.9"/>
  <text x="139" y="356" text-anchor="middle" fill="#00d4ff" font-family="Arial" font-size="30" font-weight="900" filter="url(#glow)">100B</text>
  <text x="139" y="374" text-anchor="middle" fill="#7799bb" font-family="Arial" font-size="11">transistors per chip</text>
  <text x="139" y="390" text-anchor="middle" fill="#334455" font-family="Arial" font-size="10" font-style="italic">(yes, billion. billion.)</text>
  <text x="139" y="407" text-anchor="middle" fill="#223344" font-family="Arial" font-size="10">on a fingernail</text>

  <!-- Stat 2 -->
  <rect x="230" y="322" width="158" height="96" rx="8" fill="#001428" stroke="#0066cc" stroke-width="1" opacity="0.9"/>
  <text x="309" y="356" text-anchor="middle" fill="#3399ff" font-family="Arial" font-size="30" font-weight="900">0.7nm</text>
  <text x="309" y="374" text-anchor="middle" fill="#7799bb" font-family="Arial" font-size="11">transistor node</text>
  <text x="309" y="390" text-anchor="middle" fill="#334455" font-family="Arial" font-size="10" font-style="italic">(DNA is 2nm. lol.)</text>
  <text x="309" y="407" text-anchor="middle" fill="#223344" font-family="Arial" font-size="10">7 angstroms wide</text>

  <!-- Stat 3 -->
  <rect x="400" y="322" width="158" height="96" rx="8" fill="#001428" stroke="#0044aa" stroke-width="1" opacity="0.9"/>
  <text x="479" y="356" text-anchor="middle" fill="#5588ee" font-family="Arial" font-size="30" font-weight="900">6×</text>
  <text x="479" y="374" text-anchor="middle" fill="#7799bb" font-family="Arial" font-size="11">more AI compute</text>
  <text x="479" y="390" text-anchor="middle" fill="#334455" font-family="Arial" font-size="10" font-style="italic">(Jensen, you there?)</text>
  <text x="479" y="407" text-anchor="middle" fill="#223344" font-family="Arial" font-size="10">9,000 vs 1,500 TOPS</text>

  <!-- Stat 4 -->
  <rect x="570" y="322" width="158" height="96" rx="8" fill="#001428" stroke="#003388" stroke-width="1" opacity="0.9"/>
  <text x="649" y="356" text-anchor="middle" fill="#4477cc" font-family="Arial" font-size="30" font-weight="900">70%</text>
  <text x="649" y="374" text-anchor="middle" fill="#7799bb" font-family="Arial" font-size="11">less power</text>
  <text x="649" y="390" text-anchor="middle" fill="#334455" font-family="Arial" font-size="10" font-style="italic">(charger is relieved)</text>
  <text x="649" y="407" text-anchor="middle" fill="#223344" font-family="Arial" font-size="10">vs. 2nm chips</text>

  <!-- Moore's Law callout -->
  <rect x="60" y="435" width="340" height="38" rx="6" fill="#001020" stroke="#003355" stroke-width="1" opacity="0.8"/>
  <text x="80" y="449" fill="#336688" font-family="monospace" font-size="11">Moore's Law status:</text>
  <text x="80" y="464" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold">✅ Still alive (barely) · engineers 1 — physics 0</text>

  <!-- Bottom bar -->
  <text x="60" y="530" fill="#1a2a3a" font-family="Arial" font-size="12" letter-spacing="2">theapurva.com · by Claude AI · June 27, 2026</text>

  <!-- Funny footnote -->
  <text x="60" y="558" fill="#182030" font-family="monospace" font-size="11" font-style="italic">"No transistors were harmed in the making of this chip. Probably."</text>

  <!-- Elon quote snippet -->
  <text x="60" y="590" fill="#1a2535" font-family="monospace" font-size="10">@elonmusk: "we should name nodes by atom count" — yes elon, noted, thank you</text>

</svg>
