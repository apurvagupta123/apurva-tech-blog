<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative Background Elements -->
  <circle cx="150" cy="100" r="120" fill="#3b82f6" opacity="0.05"/>
  <circle cx="1050" cy="550" r="180" fill="#8b5cf6" opacity="0.05"/>

  <!-- Grid Pattern -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Agent Nodes Visualization (representing multiple AI agents) -->
  <!-- Central Node -->
  <circle cx="600" cy="315" r="45" fill="url(#accentGradient)" opacity="0.3"/>
  <circle cx="600" cy="315" r="35" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="600" cy="315" r="8" fill="#3b82f6"/>

  <!-- Surrounding Agent Nodes -->
  <!-- Top Left -->
  <circle cx="350" cy="200" r="30" fill="#3b82f6" opacity="0.2"/>
  <circle cx="350" cy="200" r="24" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="350" cy="200" r="6" fill="#3b82f6"/>

  <!-- Top Right -->
  <circle cx="850" cy="200" r="30" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="850" cy="200" r="24" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="850" cy="200" r="6" fill="#8b5cf6"/>

  <!-- Bottom Left -->
  <circle cx="300" cy="480" r="30" fill="#3b82f6" opacity="0.2"/>
  <circle cx="300" cy="480" r="24" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="300" cy="480" r="6" fill="#3b82f6"/>

  <!-- Bottom Right -->
  <circle cx="900" cy="480" r="30" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="900" cy="480" r="24" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="900" cy="480" r="6" fill="#8b5cf6"/>

  <!-- Connection Lines -->
  <line x1="600" y1="315" x2="350" y2="200" stroke="#3b82f6" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5"/>
  <line x1="600" y1="315" x2="850" y2="200" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5"/>
  <line x1="600" y1="315" x2="300" y2="480" stroke="#3b82f6" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5"/>
  <line x1="600" y1="315" x2="900" y2="480" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5"/>

  <!-- Main Headline -->
  <text x="600" y="220" font-size="72" font-weight="900" font-family="Poppins, Arial, sans-serif"
        text-anchor="middle" fill="#ffffff">
    Agentic AI
  </text>

  <!-- Subtitle -->
  <text x="600" y="280" font-size="32" font-weight="300" font-family="Poppins, Arial, sans-serif"
        text-anchor="middle" fill="#94a3b8">
    When AI Learns to Work Together
  </text>

  <!-- Accent Bar -->
  <rect x="200" y="380" width="800" height="4" fill="url(#accentGradient)"/>

  <!-- Tagline -->
  <text x="600" y="440" font-size="20" font-weight="400" font-family="-apple-system, Segoe UI, sans-serif"
        text-anchor="middle" fill="#cbd5e1">
    The Future of Collaborative Intelligence is Here
  </text>

  <!-- Date Tag (May 2026) -->
  <rect x="100" y="540" width="200" height="60" rx="8" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="200" y="575" font-size="14" font-weight="600" font-family="-apple-system, Segoe UI, sans-serif"
        text-anchor="middle" fill="#3b82f6">
    May 2026
  </text>

  <!-- Article Badge -->
  <rect x="900" y="540" width="200" height="60" rx="8" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
  <text x="1000" y="575" font-size="14" font-weight="600" font-family="-apple-system, Segoe UI, sans-serif"
        text-anchor="middle" fill="#a78bfa">
    Technology
  </text>
</svg>