<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0d1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3333;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ff3333;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff3333;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1e35;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="redGlowFilter">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#4488ff" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#4488ff" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#4488ff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#4488ff" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#4488ff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#4488ff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#4488ff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#4488ff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#4488ff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#4488ff" stroke-width="1"/>
  </g>

  <!-- Red glow line top -->
  <rect x="0" y="2" width="1200" height="3" fill="url(#redGlow)" opacity="0.7"/>

  <!-- Left panel: Code/terminal mock -->
  <rect x="60" y="80" width="460" height="300" rx="12" fill="url(#codeGrad)" opacity="0.9"/>
  <rect x="60" y="80" width="460" height="36" rx="12" fill="#1a2a40"/>
  <rect x="60" y="104" width="460" height="12" fill="#1a2a40"/>
  <!-- Terminal dots -->
  <circle cx="90" cy="98" r="7" fill="#ff5f57"/>
  <circle cx="114" cy="98" r="7" fill="#ffbd2e"/>
  <circle cx="138" cy="98" r="7" fill="#28ca41"/>
  <!-- Terminal title -->
  <text x="290" y="102" font-family="monospace" font-size="13" fill="#8899aa" text-anchor="middle">claude-code — bash</text>

  <!-- Terminal content -->
  <text x="84" y="142" font-family="monospace" font-size="13" fill="#4af">$</text>
  <text x="100" y="142" font-family="monospace" font-size="13" fill="#8cf">claude "fix the latest Sentry error"</text>

  <text x="84" y="168" font-family="monospace" font-size="12" fill="#5a8" opacity="0.9">→ Connecting to Sentry MCP...</text>
  <text x="84" y="188" font-family="monospace" font-size="12" fill="#5a8" opacity="0.9">→ Fetching latest error events...</text>

  <!-- Fake error box -->
  <rect x="84" y="200" width="420" height="80" rx="6" fill="#1f0a0a" stroke="#cc2222" stroke-width="1.5"/>
  <text x="100" y="220" font-family="monospace" font-size="11" fill="#ff6666">Error: DatabaseConnectionError</text>
  <text x="100" y="238" font-family="monospace" font-size="11" fill="#cc4444">at app/db/connect.js:42</text>
  <!-- Hidden payload highlight -->
  <rect x="84" y="246" width="420" height="28" rx="4" fill="#3a0a0a" stroke="#ff0000" stroke-width="1" opacity="0.8"/>
