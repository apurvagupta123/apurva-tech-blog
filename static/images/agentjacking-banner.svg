  <text x="850" y="320" font-family="Arial, sans-serif" font-size="14" fill="#667799" text-anchor="middle" letter-spacing="3">AFFECTS</text>

  <rect x="580" y="332" width="180" height="42" rx="6" fill="#0a1525" stroke="#3366aa" stroke-width="1.5"/>
  <text x="670" y="358" font-family="monospace" font-size="15" fill="#66aaff" text-anchor="middle">Claude Code</text>

  <rect x="775" y="332" width="155" height="42" rx="6" fill="#0a1525" stroke="#3366aa" stroke-width="1.5"/>
  <text x="852" y="358" font-family="monospace" font-size="15" fill="#66aaff" text-anchor="middle">Cursor AI</text>

  <rect x="945" y="332" width="155" height="42" rx="6" fill="#0a1525" stroke="#3366aa" stroke-width="1.5"/>
  <text x="1022" y="358" font-family="monospace" font-size="15" fill="#66aaff" text-anchor="middle">OpenAI Codex</text>

  <!-- Attack chain diagram -->
  <rect x="575" y="410" width="130" height="60" rx="8" fill="#0d1e35" stroke="#335588" stroke-width="1.5"/>
  <text x="640" y="434" font-family="Arial, sans-serif" font-size="11" fill="#99aacc" text-anchor="middle">Attacker injects</text>
  <text x="640" y="452" font-family="Arial, sans-serif" font-size="11" fill="#99aacc" text-anchor="middle">fake Sentry error</text>
  <text x="640" y="466" font-family="Arial, sans-serif" font-size="10" fill="#5577aa" text-anchor="middle">via public DSN</text>

  <text x="725" y="444" font-family="Arial, sans-serif" font-size="20" fill="#ff4444" text-anchor="middle">→</text>

  <rect x="745" y="410" width="130" height="60" rx="8" fill="#0d1e35" stroke="#335588" stroke-width="1.5"/>
  <text x="810" y="434" font-family="Arial, sans-serif" font-size="11" fill="#99aacc" text-anchor="middle">AI agent reads</text>
  <text x="810" y="452" font-family="Arial, sans-serif" font-size="11" fill="#99aacc" text-anchor="middle">hidden payload</text>
  <text x="810" y="466" font-family="Arial, sans-serif" font-size="10" fill="#5577aa" text-anchor="middle">via MCP trust</text>

  <text x="895" y="444" font-family="Arial, sans-serif" font-size="20" fill="#ff4444" text-anchor="middle">→</text>

  <rect x="915" y="410" width="140" height="60" rx="8" fill="#1a0a0a" stroke="#883333" stroke-width="1.5"/>
  <text x="985" y="434" font-family="Arial, sans-serif" font-size="11" fill="#ff8888" text-anchor="middle">Malicious code</text>
  <text x="985" y="452" font-family="Arial, sans-serif" font-size="11" fill="#ff8888" text-anchor="middle">executes on</text>
  <text x="985" y="466" font-family="Arial, sans-serif" font-size="10" fill="#ff6666" text-anchor="middle">YOUR machine</text>

  <!-- Bottom bar -->
  <rect x="0" y="545" width="1200" height="85" fill="#060c18" opacity="0.95"/>
  <line x1="0" y1="545" x2="1200" y2="545" stroke="#ff3333" stroke-width="1.5" opacity="0.4"/>

  <text x="60" y="582" font-family="Arial, sans-serif" font-size="14" fill="#667799">Disclosed by</text>
  <text x="60" y="603" font-family="Arial Black, sans-serif" font-size="17" fill="#aabbdd">Tenet Security</text>
  <text x="60" y="620" font-family="Arial, sans-serif" font-size="12" fill="#446699">June 2026</text>

  <line x1="260" y1="558" x2="260" y2="618" stroke="#334466" stroke-width="1" opacity="0.5"/>

  <text x="290" y="582" font-family="Arial, sans-serif" font-size="14" fill="#667799">Reported to Sentry:</text>
  <text x="290" y="603" font-family="Arial Black, sans-serif" font-size="15" fill="#ff8833">"Not Defensible at Platform Level"</text>
  <text x="290" y="620" font-family="Arial, sans-serif" font-size="12" fill="#446699">Root fix declined — patch your agents now</text>

  <line x1="780" y1="558" x2="780" y2="618" stroke="#334466" stroke-width="1" opacity="0.5"/>

  <text x="820" y="582" font-family="Arial, sans-serif" font-size="13" fill="#667799">Defense:</text>
  <text x="820" y="603" font-family="monospace" font-size="15" fill="#66ff88" filter="url(#glow)">agent-jackstop</text>
  <text x="820" y="620" font-family="Arial, sans-serif" font-size="12" fill="#446699">open-source hardening configs</text>

  <text x="1140" y="595" font-family="Arial, sans-serif" font-size="12" fill="#334466" text-anchor="end">theapurva.com</text>
</svg>
