  <text x="84" y="310" font-family="monospace" font-size="12" fill="#ff5555" filter="url(#glow)">→ Executing: npx attacker-payload.js ⚠</text>
  <text x="84" y="332" font-family="monospace" font-size="12" fill="#cc3333">→ Access granted. Exfiltrating...</text>
  <text x="84" y="354" font-family="monospace" font-size="12" fill="#ff6600">█ AGENT COMPROMISED</text>

  <!-- Stats boxes -->
  <rect x="60" y="405" width="135" height="80" rx="8" fill="#0d1e35" stroke="#2244aa" stroke-width="1.5"/>
  <text x="127" y="438" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ff4444" text-anchor="middle" filter="url(#redGlowFilter)">85%</text>
  <text x="127" y="460" font-family="Arial, sans-serif" font-size="11" fill="#8899bb" text-anchor="middle">Success Rate</text>
  <text x="127" y="475" font-family="Arial, sans-serif" font-size="10" fill="#667799" text-anchor="middle">in testing</text>

  <rect x="210" y="405" width="135" height="80" rx="8" fill="#0d1e35" stroke="#2244aa" stroke-width="1.5"/>
  <text x="277" y="438" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ff8833" text-anchor="middle">2,388</text>
  <text x="277" y="460" font-family="Arial, sans-serif" font-size="11" fill="#8899bb" text-anchor="middle">Orgs Exposed</text>
  <text x="277" y="475" font-family="Arial, sans-serif" font-size="10" fill="#667799" text-anchor="middle">DSN keys public</text>

  <rect x="360" y="405" width="160" height="80" rx="8" fill="#0d1e35" stroke="#2244aa" stroke-width="1.5"/>
  <text x="440" y="438" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ff4488" text-anchor="middle">Fortune 500</text>
  <text x="440" y="460" font-family="Arial, sans-serif" font-size="11" fill="#8899bb" text-anchor="middle">Largest Victim</text>
  <text x="440" y="475" font-family="Arial, sans-serif" font-size="10" fill="#667799" text-anchor="middle">confirmed breach</text>

  <!-- Right side: Main text -->
  <!-- Warning icon -->
  <polygon points="620,95 680,195 560,195" fill="none" stroke="#ff3333" stroke-width="3" filter="url(#redGlowFilter)" opacity="0.9"/>
  <text x="620" y="180" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ff3333" text-anchor="middle" filter="url(#redGlowFilter)">!</text>

