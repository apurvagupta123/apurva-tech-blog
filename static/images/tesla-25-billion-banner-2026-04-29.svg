<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Animated accent shapes -->
  <circle cx="150" cy="80" r="120" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="1100" cy="550" r="150" fill="url(#accentGradient)" opacity="0.08"/>

  <!-- Tech grid pattern -->
  <g stroke="#3b82f6" stroke-width="1" opacity="0.1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="250" y1="0" x2="250" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="950" y1="0" x2="950" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Main headline -->
  <text x="600" y="140" font-family="Outfit, sans-serif" font-size="72" font-weight="900" fill="url(#textGradient)" text-anchor="middle" letter-spacing="-2">
    $25 BILLION
  </text>

  <!-- Subheading -->
  <text x="600" y="200" font-family="Poppins, sans-serif" font-size="44" font-weight="700" fill="#e0f2fe" text-anchor="middle" letter-spacing="1">
    Tesla's Bold Bet
  </text>

  <!-- Accent line -->
  <line x1="350" y1="230" x2="850" y2="230" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round"/>

  <!-- Supporting text -->
  <text x="600" y="300" font-family="Poppins, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1" text-anchor="middle">
    Robots • Self-Driving Cars • AI Infrastructure
  </text>

  <!-- Key stats boxes -->
  <g id="stat1" opacity="0.95">
    <rect x="150" y="380" width="280" height="180" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="290" y="425" font-family="Poppins, sans-serif" font-size="32" font-weight="900" fill="#3b82f6" text-anchor="middle">3x</text>
    <text x="290" y="465" font-family="Poppins, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">Increase vs</text>
    <text x="290" y="495" font-family="Poppins, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">Previous Year</text>
  </g>

  <g id="stat2" opacity="0.95">
    <rect x="460" y="380" width="280" height="180" fill="#1e293b" stroke="#06b6d4" stroke-width="2" rx="8"/>
    <text x="600" y="425" font-family="Poppins, sans-serif" font-size="32" font-weight="900" fill="#06b6d4" text-anchor="middle">July 2026</text>
    <text x="600" y="465" font-family="Poppins, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">Optimus</text>
    <text x="600" y="495" font-family="Poppins, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">Production Begins</text>
  </g>

  <g id="stat3" opacity="0.95">
    <rect x="770" y="380" width="280" height="180" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="910" y="425" font-family="Poppins, sans-serif" font-size="32" font-weight="900" fill="#3b82f6" text-anchor="middle">Future</text>
    <text x="910" y="465" font-family="Poppins, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">Changing</text>
    <text x="910" y="495" font-family="Poppins, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">Now</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="590" width="1200" height="40" fill="url(#accentGradient)" opacity="0.2"/>

  <!-- CTA text -->
  <text x="600" y="615" font-family="Poppins, sans-serif" font-size="16" font-weight="600" fill="#e0f2fe" text-anchor="middle">
    The tech bet that could reshape transportation, robotics, and AI
  </text>
</svg>
