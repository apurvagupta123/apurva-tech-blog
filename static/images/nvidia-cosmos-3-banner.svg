<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <!-- Background gradient: deep space dark to electric green -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050d18;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#071a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1f1a;stop-opacity:1" />
    </linearGradient>
    <!-- Green glow gradient -->
    <radialGradient id="glowGreen" cx="70%" cy="55%" r="45%">
      <stop offset="0%" style="stop-color:#00ff9d;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#00ff9d;stop-opacity:0" />
    </radialGradient>
    <!-- Blue glow gradient -->
    <radialGradient id="glowBlue" cx="20%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#0080ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:0" />
    </radialGradient>
    <!-- Grid line filter -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
    <!-- Glow filter -->
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowGreen)" />
  <rect width="1200" height="630" fill="url(#glowBlue)" />

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#00ff9d" stroke-width="0.5">
    <!-- Vertical lines -->
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Robot arm illustration (right side) -->
  <g transform="translate(760, 80)" opacity="0.85">
    <!-- Arm segments -->
    <rect x="200" y="60" width="28" height="120" rx="14" fill="none" stroke="#00ff9d" stroke-width="2.5"/>
    <rect x="200" y="195" width="28" height="100" rx="14" fill="none" stroke="#00c8ff" stroke-width="2.5" transform="rotate(-25, 214, 195)"/>
    <!-- Joint circle -->
    <circle cx="214" cy="185" r="14" fill="#0d2030" stroke="#00ff9d" stroke-width="2.5"/>
    <circle cx="214" cy="185" r="6" fill="#00ff9d" opacity="0.7"/>
    <!-- Base platform -->
    <rect x="185" y="178" width="58" height="12" rx="6" fill="#00ff9d" opacity="0.2"/>
    <!-- Gripper -->
    <line x1="230" y1="270" x2="258" y2="285" stroke="#00c8ff" stroke-width="2.5" stroke-linecap="round" transform="rotate(-25, 214, 195)"/>
    <line x1="198" y1="270" x2="170" y2="285" stroke="#00c8ff" stroke-width="2.5" stroke-linecap="round" transform="rotate(-25, 214, 195)"/>
  </g>

  <!-- World simulation sphere (center-right) -->
  <g transform="translate(870, 200)">
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00ff9d" stroke-width="1.5" opacity="0.25"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#0080ff" stroke-width="0.5" stroke-dasharray="6 8" opacity="0.3"/>
    <!-- Latitude lines -->
    <ellipse cx="0" cy="-65" rx="112" ry="28" fill="none" stroke="#00ff9d" stroke-width="0.8" opacity="0.2"/>
    <ellipse cx="0" cy="0" rx="130" ry="32" fill="none" stroke="#00ff9d" stroke-width="0.8" opacity="0.2"/>
    <ellipse cx="0" cy="65" rx="112" ry="28" fill="none" stroke="#00ff9d" stroke-width="0.8" opacity="0.2"/>
    <!-- Meridian lines -->
    <ellipse cx="0" cy="0" rx="35" ry="130" fill="none" stroke="#00c8ff" stroke-width="0.8" opacity="0.2"/>
    <ellipse cx="0" cy="0" rx="80" ry="130" fill="none" stroke="#00c8ff" stroke-width="0.8" opacity="0.2"/>
    <!-- Globe core glow -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#00ff9d" stroke-width="1.5" opacity="0.15"/>
    <circle cx="0" cy="0" r="22" fill="#00ff9d" opacity="0.08"/>
    <!-- Data nodes on sphere -->
    <circle cx="-80" cy="-30" r="5" fill="#00ff9d" opacity="0.8" filter="url(#glowFilter)"/>
    <circle cx="60" cy="-90" r="4" fill="#00c8ff" opacity="0.8" filter="url(#glowFilter)"/>
    <circle cx="110" cy="20" r="5" fill="#00ff9d" opacity="0.8" filter="url(#glowFilter)"/>
    <circle cx="20" cy="110" r="4" fill="#00c8ff" opacity="0.8" filter="url(#glowFilter)"/>
    <circle cx="-70" cy="80" r="5" fill="#00ff9d" opacity="0.7"/>
    <!-- Connection lines between nodes -->
    <line x1="-80" y1="-30" x2="60" y2="-90" stroke="#00ff9d" stroke-width="0.8" opacity="0.3"/>
    <line x1="60" y1="-90" x2="110" y2="20" stroke="#00c8ff" stroke-width="0.8" opacity="0.3"/>
    <line x1="110" y1="20" x2="20" y2="110" stroke="#00ff9d" stroke-width="0.8" opacity="0.3"/>
    <line x1="-80" y1="-30" x2="-70" y2="80" stroke="#00c8ff" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Neural network nodes (left side decorative) -->
  <g opacity="0.5">
    <circle cx="60" cy="200" r="6" fill="#00ff9d" filter="url(#glowFilter)"/>
    <circle cx="60" cy="320" r="6" fill="#00ff9d" filter="url(#glowFilter)"/>
    <circle cx="60" cy="440" r="6" fill="#00c8ff" filter="url(#glowFilter)"/>
    <circle cx="110" cy="260" r="6" fill="#00c8ff" filter="url(#glowFilter)"/>
    <circle cx="110" cy="380" r="6" fill="#00ff9d" filter="url(#glowFilter)"/>
    <!-- Connections -->
    <line x1="60" y1="200" x2="110" y2="260" stroke="#00ff9d" stroke-width="1" opacity="0.5"/>
    <line x1="60" y1="320" x2="110" y2="260" stroke="#00ff9d" stroke-width="1" opacity="0.5"/>
    <line x1="60" y1="320" x2="110" y2="380" stroke="#00c8ff" stroke-width="1" opacity="0.5"/>
    <line x1="60" y1="440" x2="110" y2="380" stroke="#00ff9d" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Floating data particles -->
  <circle cx="700" cy="120" r="3" fill="#00ff9d" opacity="0.6"/>
  <circle cx="750" cy="480" r="2" fill="#00c8ff" opacity="0.5"/>
  <circle cx="1130" cy="180" r="3" fill="#00ff9d" opacity="0.5"/>
  <circle cx="1100" cy="520" r="2" fill="#00c8ff" opacity="0.6"/>
  <circle cx="680" cy="560" r="2" fill="#00ff9d" opacity="0.4"/>

  <!-- Accent top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#bgGrad)" opacity="0"/>
  <rect x="70" y="55" width="5" height="60" rx="2.5" fill="#00ff9d" opacity="0.9"/>

  <!-- NVIDIA badge pill -->
  <rect x="70" y="68" width="140" height="32" rx="16" fill="#00ff9d" opacity="0.12"/>
  <rect x="70" y="68" width="140" height="32" rx="16" fill="none" stroke="#00ff9d" stroke-width="1.2" opacity="0.5"/>
  <text x="140" y="89" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#00ff9d" text-anchor="middle" opacity="0.9" letter-spacing="2">NVIDIA · 2026</text>

  <!-- Main headline -->
  <text x="70" y="200" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1">Teaching Robots</text>
  <text x="70" y="275" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="68" font-weight="900" fill="#00ff9d" letter-spacing="-1" filter="url(#glowFilter)">to See the World</text>

  <!-- Subheading -->
  <text x="70" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#a0c8e0" letter-spacing="0.5">NVIDIA Cosmos 3 — Physical AI Just Got Real</text>

  <!-- Divider line -->
  <line x1="70" y1="368" x2="560" y2="368" stroke="#00ff9d" stroke-width="1.5" opacity="0.4"/>

  <!-- Stat pills row -->
  <!-- Stat 1 -->
  <rect x="70" y="385" width="185" height="50" rx="10" fill="#00ff9d" opacity="0.08"/>
  <rect x="70" y="385" width="185" height="50" rx="10" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.4"/>
  <text x="162" y="407" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#00ff9d" text-anchor="middle">20 TRILLION</text>
  <text x="162" y="425" font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#7aafc8" text-anchor="middle" letter-spacing="1">TRAINING TOKENS</text>

  <!-- Stat 2 -->
  <rect x="270" y="385" width="175" height="50" rx="10" fill="#0080ff" opacity="0.08"/>
  <rect x="270" y="385" width="175" height="50" rx="10" fill="none" stroke="#0080ff" stroke-width="1" opacity="0.4"/>
  <text x="357" y="407" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#00c8ff" text-anchor="middle">MONTHS → DAYS</text>
  <text x="357" y="425" font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#7aafc8" text-anchor="middle" letter-spacing="1">TRAINING CYCLES</text>

  <!-- Stat 3 -->
  <rect x="460" y="385" width="155" height="50" rx="10" fill="#00ff9d" opacity="0.08"/>
  <rect x="460" y="385" width="155" height="50" rx="10" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.4"/>
  <text x="537" y="407" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#00ff9d" text-anchor="middle">1B+ IMAGES</text>
  <text x="537" y="425" font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#7aafc8" text-anchor="middle" letter-spacing="1">REAL WORLD DATA</text>

  <!-- Bottom tagline -->
  <text x="70" y="510" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#4a8fa8" letter-spacing="0.3">The open AI that gives robots a sense of the physical world.</text>

  <!-- Bottom branding bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#000d1a" opacity="0.6"/>
  <text x="70" y="614" font-family="'Courier New', monospace" font-size="12" fill="#00ff9d" opacity="0.6" letter-spacing="2">COSMOS 3 · PHYSICAL AI · OPEN WEIGHTS · JUNE 2026</text>
  <text x="1130" y="614" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#4a8fa8" text-anchor="end">theapurva.com</text>
</svg>
