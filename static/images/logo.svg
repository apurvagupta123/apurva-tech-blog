<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#C88A14"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#C88A14"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="150" fill="#07070F" rx="12"/>

  <!-- Hexagonal AI icon centered at (75, 75) -->
  <g transform="translate(75,75)" filter="url(#glow)">
    <!-- Outer hexagon -->
    <polygon points="0,-36 31.2,-18 31.2,18 0,36 -31.2,18 -31.2,-18"
             fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- Inner fill glow -->
    <polygon points="0,-36 31.2,-18 31.2,18 0,36 -31.2,18 -31.2,-18"
             fill="#FFD700" opacity="0.04"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="6" fill="#FFD700"/>
    <!-- Spokes -->
    <line x1="0" y1="0" x2="0" y2="-36"   stroke="#FFD700" stroke-width="1.3" opacity="0.5"/>
    <line x1="0" y1="0" x2="31.2" y2="-18" stroke="#FFD700" stroke-width="1.3" opacity="0.5"/>
    <line x1="0" y1="0" x2="31.2" y2="18"  stroke="#FFD700" stroke-width="1.3" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="36"    stroke="#FFD700" stroke-width="1.3" opacity="0.5"/>
    <line x1="0" y1="0" x2="-31.2" y2="18" stroke="#FFD700" stroke-width="1.3" opacity="0.5"/>
    <line x1="0" y1="0" x2="-31.2" y2="-18" stroke="#FFD700" stroke-width="1.3" opacity="0.5"/>
    <!-- Vertex dots -->
    <circle cx="0"    cy="-36"  r="3" fill="#FFD700"/>
    <circle cx="31.2" cy="-18"  r="3" fill="#FFD700"/>
    <circle cx="31.2" cy="18"   r="3" fill="#FFD700"/>
    <circle cx="0"    cy="36"   r="3" fill="#FFD700"/>
    <circle cx="-31.2" cy="18"  r="3" fill="#FFD700"/>
    <circle cx="-31.2" cy="-18" r="3" fill="#FFD700"/>
    <!-- Circuit extensions (top, top-right, bottom-right) -->
    <line x1="0" y1="-36" x2="0" y2="-54" stroke="#FFD700" stroke-width="1.8" opacity="0.8"/>
    <rect x="-5" y="-60" width="10" height="8" fill="none" stroke="#FFD700" stroke-width="1.8" opacity="0.8" rx="1"/>
    <line x1="31.2" y1="-18" x2="50" y2="-28" stroke="#FFD700" stroke-width="1.8" opacity="0.8"/>
    <circle cx="54" cy="-30" r="4" fill="none" stroke="#FFD700" stroke-width="1.8" opacity="0.8"/>
    <line x1="-31.2" y1="-18" x2="-50" y2="-28" stroke="#FFD700" stroke-width="1.8" opacity="0.8"/>
    <circle cx="-54" cy="-30" r="4" fill="none" stroke="#FFD700" stroke-width="1.8" opacity="0.8"/>
  </g>

  <!-- Vertical divider -->
  <line x1="145" y1="22" x2="145" y2="128" stroke="#FFD700" stroke-width="1" opacity="0.22"/>

  <!-- "THE" — small, spaced, white -->
  <text x="164" y="68"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="300"
        fill="rgba(255,255,255,0.6)"
        letter-spacing="10">THE</text>

  <!-- "APURVA" — large bold white -->
  <text x="160" y="122"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62" font-weight="700"
        fill="white"
        letter-spacing="5">APURVA</text>

  <!-- Gold underline -->
  <rect x="160" y="128" width="425" height="3.5" fill="url(#goldH)" rx="2"/>
</svg>
