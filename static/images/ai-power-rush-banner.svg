<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2847;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="orbitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Orbital circles (representing satellites/space infrastructure) -->
  <circle cx="900" cy="150" r="120" fill="url(#orbitGlow)" opacity="0.5"/>
  <circle cx="300" cy="500" r="100" fill="url(#orbitGlow)" opacity="0.3"/>

  <!-- Orbit lines -->
  <circle cx="900" cy="150" r="80" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4" stroke-dasharray="5,5"/>
  <circle cx="300" cy="500" r="70" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.3" stroke-dasharray="5,5"/>

  <!-- Data center representations (squares) -->
  <g opacity="0.6">
    <rect x="150" y="80" width="40" height="40" fill="#00d4ff" filter="url(#glow)"/>
    <rect x="200" y="120" width="35" height="35" fill="#00a8ff" filter="url(#glow)"/>
    <rect x="850" y="400" width="38" height="38" fill="#ff6b35" filter="url(#glow)"/>
    <rect x="920" y="420" width="32" height="32" fill="#ff8c42" filter="url(#glow)"/>
  </g>

  <!-- Satellite icon (simple representation) -->
  <g opacity="0.7">
    <circle cx="950" cy="100" r="12" fill="#00d4ff" filter="url(#glow)"/>
    <rect x="920" y="130" width="60" height="8" fill="#00d4ff" opacity="0.5"/>
    <rect x="935" y="115" width="30" height="20" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="8" height="630" fill="#ff6b35"/>

  <!-- Main content area -->
  <g>
    <!-- Main headline -->
    <text x="600" y="120" font-family="Poppins, -apple-system, sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="-1">
      The AI Power
    </text>
    <text x="600" y="210" font-family="Poppins, -apple-system, sans-serif" font-size="72" font-weight="700" text-anchor="middle" fill="#00d4ff" letter-spacing="-1">
      Rush
    </text>

    <!-- Subheading -->
    <text x="600" y="270" font-family="-apple-system, Segoe UI, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#a8d5ff" opacity="0.95">
      Why Big Tech Is Launching Data Centers Into Space
    </text>

    <!-- Supporting text -->
    <text x="600" y="540" font-family="-apple-system, Segoe UI, sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#7dd4ff" opacity="0.8">
      $725B in AI infrastructure spending • The power constraint nobody talks about
    </text>
  </g>

  <!-- Accent dots (representing connected systems) -->
  <g opacity="0.4">
    <circle cx="180" cy="280" r="4" fill="#ff6b35"/>
    <circle cx="1050" cy="240" r="4" fill="#00d4ff"/>
    <circle cx="120" cy="450" r="3" fill="#ff8c42"/>
    <circle cx="1080" cy="500" r="3" fill="#00a8ff"/>
  </g>

  <!-- Bottom gradient overlay for text readability -->
  <rect x="0" y="480" width="1200" height="150" fill="url(#bgGradient)" opacity="0.3"/>
</svg>