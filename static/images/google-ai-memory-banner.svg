<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
          <style>
                  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;600&display=swap');
                  .bg-gradient { fill: url(#gradientBg); }
                  .headline { font-family: 'Poppins', sans-serif; font-size: 72px; font-weight: 800; fill: #ffffff; letter-spacing: -2px; }
                  .subheadline { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 400; fill: #e0e7ff; letter-spacing: 0.5px; }
                  .accent-box { fill: rgba(255, 255, 255, 0.1); stroke: #60a5fa; stroke-width: 2; }
                  .neural-dot { fill: #60a5fa; opacity: 0.6; }
                  .memory-line { stroke: #a78bfa; stroke-width: 2; fill: none; opacity: 0.4; }
          </style>
          <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
                  <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
          </linearGradient>
    </defs>
    <rect width="1200" height="630" class="bg-gradient"/>
    <g opacity="0.15">
          <circle cx="100" cy="150" r="15" class="neural-dot"/>
          <circle cx="180" cy="200" r="12" class="neural-dot"/>
          <circle cx="120" cy="300" r="14" class="neural-dot"/>
          <circle cx="200" cy="350" r="11" class="neural-dot"/>
          <circle cx="80" cy="450" r="13" class="neural-dot"/>
          <circle cx="160" cy="520" r="10" class="neural-dot"/>
          <line x1="100" y1="150" x2="180" y2="200" class="memory-line"/>
          <line x1="180" y1="200" x2="120" y2="300" class="memory-line"/>
          <line x1="120" y1="300" x2="200" y2="350" class="memory-line"/>
          <line x1="200" y1="350" x2="80" y2="450" class="memory-line"/>
          <line x1="80" y1="450" x2="160" y2="520" class="memory-line"/>
          <line x1="100" y1="150" x2="120" y2="300" class="memory-line"/>
    </g>
    <g opacity="0.12">
          <circle cx="1100" cy="100" r="16" class="neural-dot"/>
          <circle cx="1020" cy="180" r="13" class="neural-dot"/>
          <circle cx="1080" cy="280" r="14" class="neural-dot"/>
          <circle cx="1020" cy="380" r="12" class="neural-dot"/>
          <circle cx="1100" cy="450" r="15" class="neural-dot"/>
          <circle cx="1040" cy="550" r="11" class="neural-dot"/>
          <line x1="1100" y1="100" x2="1020" y2="180" class="memory-line"/>
          <line x1="1020" y1="180" x2="1080" y2="280" class="memory-line"/>
          <line x1="1080" y1="280" x2="1020" y2="380" class="memory-line"/>
          <line x1="1020" y1="380" x2="1100" y2="450" class="memory-line"/>
          <line x1="1100" y1="450" x2="1040" y2="550" class="memory-line"/>
    </g>
    <rect x="280" y="180" width="640" height="270" rx="12" class="accent-box"/>
    <text x="600" y="340" text-anchor="middle" class="headline">Google's AI Brain</text>
    <text x="600" y="385" text-anchor="middle" class="subheadline">When AI Finally Learns to Remember</text>
    <circle cx="600" cy="420" r="3" fill="#60a5fa" opacity="0.8"/>
    <circle cx="590" cy="420" r="2" fill="#a78bfa" opacity="0.6"/>
    <circle cx="610" cy="420" r="2" fill="#a78bfa" opacity="0.6"/>
</svg>
