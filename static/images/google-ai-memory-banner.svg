<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="googleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1"/>
      <stop offset="33%" style="stop-color:#ea4335;stop-opacity:1"/>
      <stop offset="66%" style="stop-color:#fbbc05;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>

  <!-- Ambient glows -->
  <circle cx="950" cy="180" r="250" fill="#4285f4" opacity="0.06"/>
  <circle cx="250" cy="480" r="200" fill="#a78bfa" opacity="0.06"/>

  <!-- Neural network illustration (right side) -->
  <!-- Layer 1 nodes -->
  <circle cx="780" cy="160" r="12" fill="#60a5fa" opacity="0.9" filter="url(#glow)"/>
  <circle cx="780" cy="230" r="12" fill="#60a5fa" opacity="0.9" filter="url(#glow)"/>
  <circle cx="780" cy="300" r="12" fill="#60a5fa" opacity="0.9" filter="url(#glow)"/>
  <circle cx="780" cy="370" r="12" fill="#60a5fa" opacity="0.9" filter="url(#glow)"/>
  <circle cx="780" cy="440" r="12" fill="#60a5fa" opacity="0.9" filter="url(#glow)"/>

  <!-- Layer 2 nodes -->
  <circle cx="920" cy="190" r="14" fill="#a78bfa" opacity="0.9" filter="url(#glow)"/>
  <circle cx="920" cy="280" r="14" fill="#a78bfa" opacity="0.9" filter="url(#glow)"/>
  <circle cx="920" cy="370" r="14" fill="#a78bfa" opacity="0.9" filter="url(#glow)"/>
  <circle cx="920" cy="460" r="14" fill="#a78bfa" opacity="0.9" filter="url(#glow)"/>

  <!-- Layer 3 nodes -->
  <circle cx="1060" cy="230" r="12" fill="#34d399" opacity="0.9" filter="url(#glow)"/>
  <circle cx="1060" cy="315" r="12" fill="#34d399" opacity="0.9" filter="url(#glow)"/>
  <circle cx="1060" cy="400" r="12" fill="#34d399" opacity="0.9" filter="url(#glow)"/>

  <!-- Connections L1 -> L2 -->
  <line x1="792" y1="160" x2="906" y2="190" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="792" y1="160" x2="906" y2="280" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <line x1="792" y1="230" x2="906" y2="190" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="792" y1="230" x2="906" y2="280" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <line x1="792" y1="230" x2="906" y2="370" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <line x1="792" y1="300" x2="906" y2="280" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <line x1="792" y1="300" x2="906" y2="370" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <line x1="792" y1="370" x2="906" y2="370" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="792" y1="370" x2="906" y2="460" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="792" y1="440" x2="906" y2="370" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  <line x1="792" y1="440" x2="906" y2="460" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>

  <!-- Connections L2 -> L3 (highlighted) -->
  <line x1="934" y1="190" x2="1048" y2="230" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <line x1="934" y1="190" x2="1048" y2="315" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <line x1="934" y1="280" x2="1048" y2="230" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <line x1="934" y1="280" x2="1048" y2="315" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <line x1="934" y1="370" x2="1048" y2="315" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <line x1="934" y1="370" x2="1048" y2="400" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <line x1="934" y1="460" x2="1048" y2="400" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>

  <!-- Memory retention arc (decorative) -->
  <path d="M 640 315 Q 700 200 780 300" stroke="url(#accentGrad)" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Left side: Content -->

  <!-- Google tag -->
  <rect x="60" y="60" width="170" height="34" rx="17" fill="#4285f4" opacity="0.15" stroke="#4285f4" stroke-width="1"/>
  <text x="145" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4285f4" text-anchor="middle">GOOGLE AI</text>

  <!-- Main headline -->
  <text x="60" y="160" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Google's New</text>
  <text x="60" y="226" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#f1f5f9" letter-spacing="-1">AI Brain</text>

  <!-- Accent bar -->
  <rect x="60" y="244" width="340" height="4" rx="2" fill="url(#googleGrad)"/>

  <!-- Subheadline -->
  <text x="60" y="294" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">When AI Finally Learns to</text>
  <text x="60" y="322" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8">Remember Like You Do</text>

  <!-- Key concept cards -->
  <rect x="60" y="360" width="200" height="72" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="80" y="385" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Problem solved</text>
  <text x="80" y="408" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ef4444">Catastrophic</text>
  <text x="80" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ef4444">Forgetting</text>

  <rect x="275" y="360" width="200" height="72" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="295" y="385" font-family="Arial, sans-serif" font-size="11" fill="#64748b">New capability</text>
  <text x="295" y="408" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#34d399">Persistent</text>
  <text x="295" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#34d399">Memory</text>

  <rect x="490" y="360" width="200" height="72" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="510" y="385" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Architecture</text>
  <text x="510" y="408" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#60a5fa">Transformer</text>
  <text x="510" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#60a5fa">Evolution</text>

  <!-- Author + site -->
  <text x="60" y="520" font-family="Arial, sans-serif" font-size="13" fill="#475569">Written by Claude AI · theapurva.com</text>

  <!-- Bottom gradient bar -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#googleGrad)" opacity="0.7"/>
</svg>
