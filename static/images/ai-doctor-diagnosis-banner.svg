<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <defs>
    <!-- Deep medical gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d2240;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a3050;stop-opacity:1" />
    </linearGradient>
    <!-- Accent glow for AI element -->
    <radialGradient id="aiGlow" cx="75%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0" />
    </radialGradient>
    <!-- Circuit/pulse line -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- AI glow overlay -->
  <rect width="1200" height="630" fill="url(#aiGlow)" />

  <!-- Subtle grid lines (tech aesthetic) -->
  <g opacity="0.06" stroke="#00d4aa" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- ECG / heartbeat pulse line across full width -->
  <polyline
    points="0,315 80,315 110,315 125,240 140,390 155,270 170,360 185,315 300,315 380,315 410,315 430,230 450,400 470,260 490,350 510,315 640,315 720,315 750,315 770,235 790,395 810,265 830,355 850,315 980,315 1200,315"
    fill="none" stroke="url(#lineGrad)" stroke-width="2.5" opacity="0.5" filter="url(#glow)"
  />

  <!-- Right side: AI brain / circular element -->
  <circle cx="880" cy="315" r="160" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.15"/>
  <circle cx="880" cy="315" r="130" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.2"/>
  <circle cx="880" cy="315" r="100" fill="none" stroke="#1de9b6" stroke-width="1.5" opacity="0.3"/>
  <circle cx="880" cy="315" r="72" fill="#0d2240" stroke="#1de9b6" stroke-width="2" opacity="0.9"/>

  <!-- Cross / medical symbol inside circle -->
  <rect x="862" y="282" width="36" height="66" rx="6" fill="#1de9b6" opacity="0.9" filter="url(#glow)"/>
  <rect x="847" y="297" width="66" height="36" rx="6" fill="#1de9b6" opacity="0.9" filter="url(#glow)"/>

  <!-- Small dots around the circle (neural nodes) -->
  <g fill="#00d4aa" opacity="0.6" filter="url(#glow)">
    <circle cx="880" cy="145" r="5"/>
    <circle cx="1007" cy="205" r="4"/>
    <circle cx="1040" cy="315" r="5"/>
    <circle cx="1007" cy="425" r="4"/>
    <circle cx="880" cy="485" r="5"/>
    <circle cx="753" cy="425" r="4"/>
    <circle cx="720" cy="315" r="5"/>
    <circle cx="753" cy="205" r="4"/>
  </g>

  <!-- Connecting lines from nodes to center circle -->
  <g stroke="#00d4aa" stroke-width="1" opacity="0.2">
    <line x1="880" y1="150" x2="880" y2="243"/>
    <line x1="1002" y1="208" x2="956" y2="258"/>
    <line x1="1035" y1="315" x2="952" y2="315"/>
    <line x1="1002" y1="422" x2="956" y2="372"/>
    <line x1="880" y1="480" x2="880" y2="387"/>
    <line x1="758" y1="422" x2="804" y2="372"/>
    <line x1="725" y1="315" x2="808" y2="315"/>
    <line x1="758" y1="208" x2="804" y2="258"/>
  </g>

  <!-- AI label inside circle bottom -->
  <text x="880" y="348" font-family="'Courier New', monospace" font-size="13" fill="#1de9b6" text-anchor="middle" opacity="0.9">AI</text>

  <!-- Left side: Main text content -->
  <!-- Category tag -->
  <rect x="60" y="85" width="180" height="34" rx="17" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="1.5"/>
  <text x="150" y="107" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#00d4aa" text-anchor="middle" letter-spacing="2">HEALTHCARE · AI</text>

  <!-- Main headline line 1 -->
  <text x="60" y="192" font-family="'Segoe UI', Georgia, serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">The Doctor</text>

  <!-- Main headline line 2 -->
  <text x="60" y="265" font-family="'Segoe UI', Georgia, serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">Will See You</text>

  <!-- Main headline line 3 – highlighted word -->
  <text x="60" y="338" font-family="'Segoe UI', Georgia, serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1">Now — <tspan fill="#1de9b6" filter="url(#softGlow)">AI</tspan> Style</text>

  <!-- Divider line -->
  <rect x="60" y="362" width="100" height="3" rx="2" fill="#00d4aa" opacity="0.8"/>

  <!-- Subheading -->
  <text x="60" y="402" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#94b8d4" letter-spacing="0.3">Harvard study: AI outperforms doctors in</text>
  <text x="60" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#94b8d4" letter-spacing="0.3">emergency room diagnosis — 67% vs 55%</text>

  <!-- Stats highlight bar -->
  <rect x="60" y="465" width="580" height="56" rx="10" fill="#ffffff" opacity="0.08" stroke="#00d4aa" stroke-width="1"/>

  <!-- Stat 1 -->
  <text x="110" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94b8d4">AI accuracy</text>
  <text x="110" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1de9b6" filter="url(#glow)">67%</text>

  <!-- Divider -->
  <rect x="210" y="472" width="1.5" height="42" fill="#00d4aa" opacity="0.3"/>

  <!-- Stat 2 -->
  <text x="230" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94b8d4">Doctor accuracy</text>
  <text x="230" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">50–55%</text>

  <!-- Divider -->
  <rect x="360" y="472" width="1.5" height="42" fill="#00d4aa" opacity="0.3"/>

  <!-- Stat 3 -->
  <text x="380" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94b8d4">Perfect reasoning</text>
  <text x="380" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#1de9b6" filter="url(#glow)">98%</text>

  <!-- Divider -->
  <rect x="495" y="472" width="1.5" height="42" fill="#00d4aa" opacity="0.3"/>

  <!-- Stat 4 -->
  <text x="515" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94b8d4">ER cases tested</text>
  <text x="515" y="508" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">76</text>

  <!-- Bottom bar: source credit -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.35"/>
  <text x="60" y="615" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64899e" letter-spacing="0.5">theapurva.com</text>
  <text x="1140" y="615" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64899e" text-anchor="end" letter-spacing="0.5">by Claude AI</text>
</svg>
